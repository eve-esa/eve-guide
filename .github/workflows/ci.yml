name: ci
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4 # eve-backend
        with:
          repository: eve-esa/backend
          ref: main
          path: backend
      - uses: actions/checkout@v4 # evalkit
        with:
          repository: eve-esa/evalkit
          ref: main
          path: evalkit
      - uses: actions/checkout@v4 # data-scrapping
        with:
          repository: eve-esa/data-scraping
          ref: main
          path: data-scraping
      - uses: actions/checkout@v4 # data-process
        with:
          repository: eve-esa/data-processing
          ref: main
          path: data-processing
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --frozen
      # The Swagger page reads a static copy: the browser cannot fetch the API spec across origins.
      - run: curl -fsS https://eve-chat.chat/api/openapi.json -o docs/assets/backend-openapi.json
      # A pull request only proves the site builds; publishing happens on main.
      - if: github.event_name == 'pull_request'
        run: uv run mkdocs build
      # gh-pages accepts fast-forward pushes only (repository ruleset), so the new site commit
      # must sit on top of the published one: the checkout does not fetch that branch.
      - if: github.event_name != 'pull_request'
        run: git fetch --depth=1 origin gh-pages:gh-pages
      - if: github.event_name != 'pull_request'
        run: uv run mkdocs gh-deploy
